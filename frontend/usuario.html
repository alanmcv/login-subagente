<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Mi Cuenta | SecureAuth Pro</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div class="bg-gradient-mesh"></div>

  <div class="app-container">
    <header class="app-header">
      <div class="brand-badge">
        <svg class="brand-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <path d="M12 2L2 7l10 5 10-5-10-5zM2 17l10 5 10-5M2 12l10 5 10-5"/>
        </svg>
        <span>SecureAuth Pro</span>
      </div>
      <h1 class="brand-title">Mi Cuenta</h1>
      <p class="brand-subtitle">Página personal del usuario autenticado</p>
    </header>

    <main class="auth-card">
      <section id="userSection" class="view-section hidden">
        <div class="dashboard-header">
          <div class="user-avatar-badge" id="userAvatar">U</div>
          <div class="user-intro">
            <span class="status-online-pill">
              <span class="pulse-dot"></span> Sesión Activa
            </span>
            <h2 class="welcome-heading" id="userWelcome">¡Bienvenido!</h2>
            <p class="user-role-label">Acceso Autorizado</p>
          </div>
        </div>

        <div class="dashboard-details-card">
          <h3 class="details-section-title">Datos del Usuario</h3>
          <div class="data-row">
            <span class="data-label">ID de Usuario:</span>
            <span class="data-value" id="profileId">-</span>
          </div>
          <div class="data-row">
            <span class="data-label">Nombre Completo:</span>
            <span class="data-value" id="profileName">-</span>
          </div>
          <div class="data-row">
            <span class="data-label">Correo Electrónico:</span>
            <span class="data-value" id="profileEmail">-</span>
          </div>
          <div class="data-row">
            <span class="data-label">Miembro desde:</span>
            <span class="data-value" id="profileCreated">-</span>
          </div>
        </div>

        <div class="dashboard-actions">
          <button type="button" id="btnLogout" class="btn-danger">
            <svg class="action-btn-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/>
              <polyline points="16 17 21 12 16 7"/>
              <line x1="21" y1="12" x2="9" y2="12"/>
            </svg>
            <span>Cerrar Sesión</span>
          </button>
        </div>
      </section>
    </main>
  </div>

  <script src="usuario.js"></script>
</body>
</html>
